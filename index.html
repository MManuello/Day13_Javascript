<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS messaround</title>
</head>
<body>
    <h1>lets learn javascript> </h1>
    <h2>lets learn about onclick  and alerts</h2>

    <a href="https://youtube.com" onclick="alert('warning you are about to leave the page!')">youtube</a>

    <h2>how do we display and hide text</h2>
    <h2> whats my secret identity</h2>
    <p id="secret"></p>
    <button onclick="document.getElementById('secret').innerHTML = 'I have a big brain, I am Megamind';
    document.getElementById('secret').style.display= 'block';">Reveal!</button>
    <button onclick="document.getElementById('secret').style.display= 'none';">Hide!</button>
</body>
</html>
